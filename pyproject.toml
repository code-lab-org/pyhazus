[project]
name = "pyhazus"
version = "0.0.1"
description = "Standalone Python implementation of the FEMA Hazus loss estimation methodology (flood first)."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.scripts]
hazus = "hazus.cli:main"

[project.optional-dependencies]
geo = [
    "geopandas>=1.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
]
dev = [
    "pytest>=8",
]
# One-time database export tooling (tools/export_db.py)
tools = [
    "pymssql>=2.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hazus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
